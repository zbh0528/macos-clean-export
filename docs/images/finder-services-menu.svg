<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Finder Services menu showing clean copy and clean zip actions</title>
  <desc id="desc">A Finder context menu preview for a demo folder, with Services expanded and the clean export actions visible.</desc>
  <defs>
    <linearGradient id="menu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset="1" stop-color="#f0f1f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="960" height="640" fill="#f7f7f7"/>
  <g opacity=".72">
    <rect x="0" y="52" width="960" height="24" rx="12" fill="#e7e7e7"/>
    <rect x="0" y="98" width="960" height="24" rx="12" fill="#efefef"/>
    <rect x="0" y="144" width="960" height="24" rx="12" fill="#e7e7e7"/>
    <rect x="0" y="190" width="960" height="24" rx="12" fill="#efefef"/>
    <rect x="0" y="236" width="960" height="24" rx="12" fill="#e7e7e7"/>
    <rect x="0" y="282" width="960" height="24" rx="12" fill="#efefef"/>
    <rect x="0" y="328" width="960" height="24" rx="12" fill="#e7e7e7"/>
    <rect x="0" y="374" width="960" height="24" rx="12" fill="#efefef"/>
    <rect x="0" y="420" width="960" height="24" rx="12" fill="#e7e7e7"/>
    <rect x="0" y="466" width="960" height="24" rx="12" fill="#efefef"/>
    <rect x="0" y="512" width="960" height="24" rx="12" fill="#e7e7e7"/>
    <rect x="0" y="558" width="960" height="24" rx="12" fill="#efefef"/>
  </g>
  <rect x="0" y="7" width="960" height="22" fill="#0569db"/>
  <circle cx="18" cy="18" r="8" fill="none" stroke="#fff" stroke-width="2"/>
  <path d="M15 13l5 5-5 5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="33" y="10" width="22" height="16" rx="2" fill="#7bc8df"/>
  <path d="M35 13h9l2 3h9v9H35z" fill="#4fa8cf"/>
  <text x="63" y="24" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#fff">CleanExportDemo</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="15" fill="#242424" filter="url(#shadow)">
    <rect x="262" y="18" width="286" height="520" rx="16" fill="url(#menu)" stroke="#d8d9dc"/>
    <text x="306" y="47">在新标签页中打开</text>
    <text x="306" y="78">显示已下载文件夹</text>
    <line x1="282" y1="96" x2="528" y2="96" stroke="#d3d4d7"/>
    <text x="306" y="128">移到废纸篓</text>
    <line x1="282" y1="148" x2="528" y2="148" stroke="#d3d4d7"/>
    <text x="306" y="179">显示简介</text>
    <text x="306" y="211">重新命名</text>
    <text x="306" y="243">压缩“CleanExportDemo”</text>
    <text x="306" y="275">复制</text>
    <text x="306" y="307">制作替身</text>
    <text x="306" y="339">快速查看</text>
    <line x1="282" y1="358" x2="528" y2="358" stroke="#d3d4d7"/>
    <text x="306" y="389">拷贝</text>
    <text x="306" y="421">共享...</text>
    <line x1="282" y1="440" x2="528" y2="440" stroke="#d3d4d7"/>
    <g transform="translate(304 461)">
      <circle cx="0" cy="0" r="8" fill="#ff5b5b"/>
      <circle cx="29" cy="0" r="8" fill="#ff9b43"/>
      <circle cx="58" cy="0" r="8" fill="#ffd44d"/>
      <circle cx="87" cy="0" r="8" fill="#5bd172"/>
      <circle cx="116" cy="0" r="8" fill="#48a5ff"/>
      <circle cx="145" cy="0" r="8" fill="#c94df0"/>
      <circle cx="174" cy="0" r="8" fill="#aaa"/>
    </g>
    <text x="306" y="494">自定义文件夹...</text>
    <line x1="282" y1="512" x2="528" y2="512" stroke="#d3d4d7"/>
    <text x="306" y="526">从 iPhone 导入</text>
    <path d="M514 518l7 8-7 8" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="270" y="545" width="270" height="31" rx="7" fill="#5aa7ff"/>
    <text x="306" y="566" fill="#fff" font-weight="600">服务</text>
    <path d="M514 553l7 8-7 8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="542" y="352" width="284" height="250" rx="16" fill="url(#menu)" stroke="#d8d9dc"/>
    <text x="563" y="386">创建服务</text>
    <text x="563" y="418">创建工作流程</text>
    <text x="563" y="450" font-weight="700">干净复制到 U 盘</text>
    <text x="563" y="482" font-weight="700">干净压缩</text>
    <line x1="558" y1="501" x2="807" y2="501" stroke="#d3d4d7"/>
    <text x="563" y="532">文件夹操作设置...</text>
    <text x="563" y="564">新建位于文件夹位置的终端窗口</text>
    <text x="563" y="592">Open URL in BibDesk Web Group</text>
  </g>
</svg>
